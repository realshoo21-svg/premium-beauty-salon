<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery — Premium Beauty Salon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <a class="brand" href="index.html">Premium Beauty Salon</a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="nav" id="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="gallery.html" class="nav-link active">Gallery</a>
        <a href="packages.html" class="nav-link">Packages</a>
        <a href="offers.html" class="nav-link">Offers</a>
        <a href="team.html" class="nav-link">Team</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="reveal-up">Gallery</h1>
    <div class="filters reveal-up delay-1">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="bridal">Bridal</button>
      <button class="filter" data-filter="makeup">Makeup</button>
      <button class="filter" data-filter="hair">Hair</button>
      <button class="filter" data-filter="mehndi">Mehndi</button>
      <button class="filter" data-filter="nails">Nails</button>
      <button class="filter" data-filter="salon">Salon</button>
    </div>

    <div class="gallery-grid reveal-grid" id="gallery">
      <div class="gallery-item" data-category="bridal">
        <img src="assets/image/gallery/gallery-01.jpg.jpg" alt="Bridal 1">
      </div>
      <div class="gallery-item" data-category="makeup">
        <img src="assets/image/gallery/gallery-02.jpg.jpg" alt="Makeup 1">
      </div>
      <div class="gallery-item" data-category="hair">
        <img src="assets/image/gallery/gallery-03.jpg.jpg" alt="Hair 1">
      </div>
      <div class="gallery-item" data-category="mehndi">
        <img src="assets/image/gallery/gallery-04.jpg.jpg" alt="Mehndi 1">
      </div>
      <div class="gallery-item" data-category="bridal">
        <img src="assets/image/gallery/gallery-05.jpg.jpg" alt="Bridal 2">
      </div>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Close">✕</button>
      <button class="lightbox-prev" aria-label="Previous">◀</button>
      <div class="lightbox-content"><img src="" alt=""/></div>
      <button class="lightbox-next" aria-label="Next">▶</button>
    </div>

  </main>

  <button id="whatsapp-fab" aria-label="WhatsApp">💬</button>
  <script src="main.js"></script>
</body>
</html>
